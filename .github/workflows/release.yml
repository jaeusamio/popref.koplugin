name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build zip
        run: |
          mkdir -p dist/popref.koplugin
          cp _meta.lua main.lua popref_*.lua dist/popref.koplugin/
          cd dist && zip -r "popref.koplugin-${GITHUB_REF_NAME}.zip" popref.koplugin

      - name: Build changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
            if [ -n "$prev" ]; then
              echo
              echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > dist/CHANGELOG.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/popref.koplugin-${GITHUB_REF_NAME}.zip" --notes-file dist/CHANGELOG.md
